# A안 배포 구조:
#   이 compose 는 "신규 FastAPI 인증/RBAC API" 전용이다.
#   기존 ai-orchestrator-dashboard.service / ai-orchestrator-monitor.service
#   (systemd) 는 이 compose 로 관리하지 않는다. 서비스는 단 1개.
name: haehan-ai-orchestrator
version: "3.9"

services:
  ai-orchestrator-api:
    build:
      context: .
      dockerfile: Dockerfile
      # 빌드 식별(/api/v1/health 의 git_sha·build_time). tools/server_deploy.py 가 값을 넘기고, 없으면 "unknown".
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: haehan-ai-orchestrator-api:local
    container_name: haehan-ai-orchestrator-api
    working_dir: /app
    command: ["uvicorn", "ai_orchestrator.asgi:app", "--host", "0.0.0.0", "--port", "8400"]
    # dashboard=5050 점유 중, monitor=내부. 8400 은 비어있음.
    # 외부 직접 공개 금지: 127.0.0.1 바인딩 (reverse proxy 는 추후 단계에서 부착).
    ports:
      - "127.0.0.1:8400:8400"
    env_file:
      - .env
    environment:
      # 컨테이너 내부 고정 경로. .env 가 override 해도 이 값이 우선 적용된다.
      LOG_DIR: /app/ai_orchestrator/storage
      HTTP_USERS_PATH: /run/secrets/api/http_users.json
      AUTH_ENABLED: "true"
      # 서버 .env 에 JWT_SECRET 을 설정한 뒤 true 로 켠다(기본 false = 경고만). 없는 채로 켜면 시작하지 않는다.
      JWT_SECRET_REQUIRED: ${JWT_SECRET_REQUIRED:-false}
      APP_HOST: 0.0.0.0
      APP_PORT: "8400"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      # 로그/토큰/인박스 등 런타임 산출물 — dashboard/monitor 호스트 storage 와 섞이지 않도록 전용 named volume.
      - api_storage:/app/ai_orchestrator/storage
      # uvicorn 프로세스 로그(/app/logs) — 컨테이너 재생성 시 소실 방지.
      - ./data/app-logs:/app/logs
      # 운영 계정 해시 파일 + 향후 사이트 secrets. 호스트의 ./secrets/api 하위만 read-only 로 노출.
      - ./secrets/api:/run/secrets/api:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8400/api/v1/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # default: 본 compose 전용 네트워크 (기존 동작 유지)
      - default
      # app_web: 기존 nginx(컨테이너) 가 속한 외부 네트워크. nginx → API DNS 접근용.
      - app_web

  admin-web:
    build:
      context: .
      dockerfile: admin-web/Dockerfile
    image: haehan-ai-orchestrator-admin-web:local
    container_name: haehan-ai-orchestrator-admin-web
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Next 미들웨어가 로그인 쿠키(JWT)의 서명을 검증하려면 API 와 같은 값이 필요하다. 비면 쿠키 존재만 확인한다.
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      ai-orchestrator-api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - app_web

  browser-worker:
    build:
      context: .
      dockerfile: docker/browser-worker.Dockerfile
    image: haehan-ai-orchestrator-browser-worker:local
    container_name: haehan-ai-orchestrator-browser-worker
    working_dir: /app
    command: ["uvicorn", "ai_orchestrator.browser_tool.worker.app:app", "--host", "0.0.0.0", "--port", "8500"]
    expose:
      - "8500"
    environment:
      BROWSER_WORKER_MODE: server
      BROWSER_WORKER_ALLOW_EXTERNAL_URLS: "false"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BROWSER_EXECUTION_ENABLED: ${BROWSER_EXECUTION_ENABLED:-false}
    volumes:
      # Temporary directory for browser cache (not persistent)
      - /dev/shm:/dev/shm:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8500/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

volumes:
  api_storage:
    # 기존 haehan-orchestrator-logs (구 compose) 와 겹치지 않게 명시 이름 지정.
    name: haehan-ai-orchestrator-api-storage

networks:
  # app 프로젝트(/home/ubuntu/app/docker-compose.yml) 에서 정의한 bridge.
  # external: true 로 참조만 하며, 이 compose 가 생성/삭제하지 않는다.
  app_web:
    external: true
    name: app_web
