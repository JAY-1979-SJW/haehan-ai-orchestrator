# ruff 품질 게이트 설정
# 참조: https://docs.astral.sh/ruff/configuration/

line-length = 120
target-version = "py314"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (미사용 import, 미정의 변수 등)
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (잠재적 버그)
    "S",    # flake8-bandit (보안)
    "I",    # isort (import 정렬)
    "UP",   # pyupgrade (구버전 문법)
    "RUF",  # ruff 전용 규칙
    "BLE",  # flake8-blind-except (STD-04: except Exception 남용 금지, 2026-09-28 추가)
    "C901",     # mccabe 복잡도 (STD-08: CLAUDE.md 4장 "복잡도 10... 넘으면 나눈다" 를 실제로 검사, 2026-09-29 추가)
    "PLR0912",  # too-many-branches (STD-08 동일 근거)
    "PLR0913",  # too-many-arguments (STD-08, CLAUDE.md 4장 "인자 6개")
    "PLR0915",  # too-many-statements (STD-08)
    "A005",     # stdlib-module-shadowing — 표준 라이브러리와 같은 이름의 모듈 금지(scripts/google 의 calendar 모듈이 표준 calendar 를 가려 직접 실행이 깨진 사고 → 이름 변경, 2026-10-08)
]
ignore = [
    "E501",   # line too long — 120자 제한으로 완화
    "S101",   # assert 사용 — 테스트 코드에서 정상
    "S603",   # subprocess — 이 프로젝트에서 의도적 사용
    "S607",   # subprocess partial path — 동일
    "S608",   # SQL injection — ORM 사용
    "B008",   # FastAPI Depends() 패턴
    "B904",   # raise from — 기존 코드 호환
    "UP007",  # X | Y 타입 힌트 — Python 3.9 호환
    "RUF012", # mutable class attrs — FastAPI 패턴
    "RUF001", # ambiguous unicode (×, ✕ 등) — 한국어 UI 기호 의도적 사용
    "RUF002", # ambiguous unicode in docstring — 동일
    "RUF003", # ambiguous unicode in comment — 동일
]

[lint.mccabe]
# 32. Claude 개발표준/project/ruff.toml 과 동일 임계값(2026-09-29 신규 도입, STD-08).
max-complexity = 10

[lint.flake8-builtins]
# strict: 패키지 경로가 아니라 파일 이름만으로 판정 — 그 폴더의 스크립트를 직접 실행하면 sys.path[0] 이 그 폴더라 하위 모듈도 표준 모듈을 가린다.
strict-checking = true

[lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[lint.per-file-ignores]
"tests/**" = ["S", "B", "PLR0913", "PLR0915"]     # 테스트 함수는 fixture 인자·단계가 많은 게 정상 (32번 표준의 tests/** 완화와 동일 취지)
"scripts/**" = ["S", "B"]

[lint.flake8-bugbear]
# audit-kit std(32. Claude 개발표준 기준서 검사)가 이 항목을 읽어 표준 번들 ruff.toml 의
# extend-immutable-calls(fastapi.Depends 등)에 병합한다(2026-09-29, docs/incidents 참고).
# 이 프로젝트 위의 B008 블랭킷 ignore 와 별개로, Depends(require_role(...)) 처럼 Depends()
# 안에 중첩된 이 프로젝트 고유 팩토리 호출을 정밀하게 예외 처리하기 위한 항목.
extend-immutable-calls = [
    "tools.gates.auth.require_role",
    # LoginRequest(): 요청 바디 기본값으로만 쓰이고 핸들러 안에서 읽기만 함(변형 없음,
    # 2026-09-29 확인) — naver_session_router.py:trigger_login.
    "ai_orchestrator.connectors.naver_auth.session_router.LoginRequest",
]

[format]
quote-style = "double"
indent-style = "space"
