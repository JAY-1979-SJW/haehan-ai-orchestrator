<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 2026-09-29 electron-verifier 검증(FAIL) 대응: 이 창엔 원격/신뢰 안 된 콘텐츠가 직접
     로드되지 않지만(항상 SERVER + "/" 로만 이동, 실제 콘텐츠는 <webview> 안에서 격리됨),
     Electron 공식 체크리스트 6번이 모든 창에 CSP를 요구한다. object-src 'none' + 자기 자신
     외 스크립트/스타일 금지. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none';">
<title>Haehan AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* head/style/script 가 텍스트로 렌더되던 문제 방지 — UA display:none 강제 보장 */
  head, style, script, title, meta, link { display: none !important; }
  html, body { height: 100%; overflow: hidden; display: flex; flex-direction: column; background: #F5F7FA; }
  webview { flex: 1; width: 100%; border: none; min-height: 0; }
</style>
</head>
<body>
<webview id="view" allowpopups partition="persist:haehan"></webview>

<script>
  const params  = new URLSearchParams(location.search);
  const SERVER  = params.get("server")  || "http://localhost:3000";
  const LICENSE = params.get("license") || "";
  const PRELOAD = params.get("preload") || "";

  const view = document.getElementById("view");

  // 로컬 설정 브리지(P1-3) preload 부착 — src 설정 전에 지정해야 적용됨
  if (PRELOAD) view.setAttribute("preload", PRELOAD);

  // 초기 로드 — Next.js 메인 페이지
  view.src = SERVER + "/";

  // 키보드 포커스: <webview> 안 페이지는 사용자가 한 번 클릭하기 전까지 키 입력을 못 받는다
  // (실측 2026-10-08, 설치본 E2E: 포커스 없이 input.fill()/타이핑하면 keydown·input 이벤트가
  // 게스트에 전혀 안 닿아 /setup 폼이 빈 값으로 제출됨 — webview.focus() 한 번이면 해결).
  // 첫 화면(/setup 이름 입력 등)에서 바로 타이핑할 수 있게 로드 직후·창 복귀 시 포커스를 준다.
  view.addEventListener("dom-ready", () => view.focus());
  window.addEventListener("focus", () => view.focus());

  // 2026-09-29: 팝업/외부링크 분기(구 new-window 이벤트)는 메인 프로세스로 이동했다
  // (main.js의 app.on("web-contents-created", ...)) — 이 창은 nodeIntegration:false라
  // require가 없어 여기서 직접 shell.openExternal을 부르면 항상 ReferenceError였다
  // (electron-verifier 검증 실측 발견). will-navigate(같은 탭 이동) 가드도 같은 곳에서
  // 함께 처리한다.

  // YouTube 토큰 상태 확인 (트레이 메뉴 연동용)
  fetch(SERVER + "/api/v1/oauth/youtube/status", {
    headers: { "x-license-key": LICENSE }
  }).then(r => r.json()).then(d => {
    if (window.electronAPI) {
      window.electronAPI.onYouTubeStatus && window.electronAPI.onYouTubeStatus(d.ok ? "connected" : "disconnected");
    }
  }).catch(() => {});
</script>
</body>
</html>
