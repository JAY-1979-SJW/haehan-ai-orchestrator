<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구글 허브</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'Malgun Gothic', sans-serif; }
html, body { height: 100%; background: #0F172A; color: #E2E8F0; overflow: hidden; display: flex; flex-direction: column; }

/* ── 헤더 ── */
#header {
  padding: 14px 20px 10px; background: #0F172A;
  border-bottom: 1px solid #1E293B;
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
#header h1 { font-size: 15px; font-weight: 700; color: #60A5FA; }
#search {
  flex: 1; max-width: 320px; padding: 6px 12px;
  background: #1E293B; border: 1px solid #334155; border-radius: 20px;
  color: #E2E8F0; font-size: 13px; outline: none;
}
#search:focus { border-color: #60A5FA; }
#status-bar { font-size: 11px; color: #64748B; margin-left: auto; }

/* ── 도메인 카드 그리드 ── */
#cards-wrap { flex: 1; overflow-y: auto; padding: 12px 16px; }
.group-label {
  font-size: 11px; font-weight: 700; color: #475569; letter-spacing: 0.08em;
  text-transform: uppercase; margin: 10px 0 6px;
}
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 4px; }
.card {
  background: #1E293B; border: 1px solid #334155; border-radius: 10px;
  padding: 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  position: relative;
}
.card:hover { background: #253347; border-color: #60A5FA33; }
.card.active { border-color: #60A5FA; background: #1A2A3F; }
.card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-icon { font-size: 20px; line-height: 1; }
.card-name { font-size: 13px; font-weight: 600; color: #E2E8F0; }
.card-desc { font-size: 11px; color: #94A3B8; line-height: 1.4; margin-bottom: 8px; min-height: 30px; }
.card-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.btn-action {
  font-size: 10px; padding: 3px 8px; border: none; border-radius: 4px; cursor: pointer;
  font-weight: 600; transition: background 0.1s;
}
.btn-open   { background: #1D4ED8; color: #BFDBFE; }
.btn-open:hover { background: #2563EB; }
.btn-do     { background: #064E3B; color: #6EE7B7; }
.btn-do:hover { background: #065F46; }
.badge-approval {
  position: absolute; top: 8px; right: 8px;
  font-size: 9px; background: #78350F; color: #FCD34D; padding: 1px 5px; border-radius: 3px;
}
.card.hidden { display: none; }

/* ── 채팅 영역 ── */
#chat-area {
  flex-shrink: 0; border-top: 1px solid #1E293B;
  background: #0F172A; display: flex; flex-direction: column; height: 220px;
}
#chat-messages {
  flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 6px;
}
.msg { max-width: 85%; padding: 7px 12px; border-radius: 10px; font-size: 12px; line-height: 1.5; }
.msg.user { align-self: flex-end; background: #1D4ED8; color: #EFF6FF; border-bottom-right-radius: 3px; }
.msg.ai   { align-self: flex-start; background: #1E293B; color: #E2E8F0; border-bottom-left-radius: 3px; }
.msg.ai .domain-tag { display: inline-block; background: #0F3460; color: #60A5FA; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-right: 4px; }
.msg.ai .action-tag { display: inline-block; background: #1A3A1A; color: #6EE7B7; font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.msg.ai .err { color: #F87171; }
.msg.system { align-self: center; background: transparent; color: #475569; font-size: 11px; font-style: italic; }
#chat-input-row {
  display: flex; gap: 8px; padding: 8px 16px 10px; align-items: center;
}
#chat-input {
  flex: 1; padding: 8px 14px; background: #1E293B; border: 1px solid #334155;
  border-radius: 20px; color: #E2E8F0; font-size: 13px; outline: none;
}
#chat-input:focus { border-color: #60A5FA; }
#chat-input::placeholder { color: #475569; }
#chat-send {
  padding: 8px 16px; background: #1D4ED8; color: white; border: none;
  border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
  white-space: nowrap;
}
#chat-send:hover { background: #2563EB; }
#chat-send:disabled { background: #334155; color: #64748B; cursor: default; }
</style>
</head>

<div id="header">
  <h1>🌐 구글 허브</h1>
  <input id="search" type="text" placeholder="도메인·기능 검색..." oninput="filterCards(this.value)">
  <span id="status-bar">32개 도메인</span>
</div>

<div id="cards-wrap" id="cards-container"></div>

<div id="chat-area">
  <div id="chat-messages">
    <div class="msg system">AI에게 한국어로 명령하세요 — 예) "캘린더에 내일 오전 10시 미팅 추가해줘", "드라이브에서 최근 파일 보여줘"</div>
  </div>

// ── UI 렌더링 ──────────────────────────────────────────────────────────────

  const wrap = document.getElementById("cards-wrap");
  const groups = [...new Set(CATALOG.map(d => d.g))];
  groups.forEach(g => {
    const label = document.createElement("div");
    label.className = "group-label"; label.textContent = g; label.dataset.group = g;
    wrap.appendChild(label);
    const row = document.createElement("div");
    row.className = "cards"; row.dataset.group = g;
    CATALOG.filter(d => d.g === g).forEach(d => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.host = d.host; card.dataset.name = d.name; card.dataset.desc = d.desc;
      if (d.doKey) {
        const badge = document.createElement("span");
        badge.className = "badge-approval"; badge.textContent = "승인필요"; card.appendChild(badge);
      }
      const hasApi = !!ACTION_APIS[d.openKey];
      card.innerHTML += `
        <div class="card-top">
          <span class="card-icon">${d.icon}</span>
          <span class="card-name">${d.name}</span>
        </div>
        <div class="card-desc">${d.desc}</div>
        <div class="card-actions">
          <button class="btn-action btn-open" onclick="openDomain('${d.url}','${d.name}','${d.openKey}')">
            ${hasApi ? '📊 가져오기' : '🔗 열기'}
          </button>
          ${d.doKey ? `<button class="btn-action btn-do" onclick="requestAction('${d.host}','${d.doKey}','${d.doLabel}','${d.name}')">${d.doLabel}</button>` : ''}
        </div>`;
      card.addEventListener("click", e => { if (e.target.tagName === "BUTTON") return; highlightCard(d.host); });
      row.appendChild(card);
    });
    wrap.appendChild(row);
  });
  document.getElementById("status-bar").textContent = `${CATALOG.length}개 서비스`;
}

function highlightCard(host) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c.dataset.host === host));
}

function filterCards(q) {
  const kw = q.trim().toLowerCase();
  const groups = {};
  CATALOG.forEach((d, i) => {
    const match = !kw || d.name.toLowerCase().includes(kw) || d.desc.toLowerCase().includes(kw) || d.host.includes(kw) || d.g.toLowerCase().includes(kw);
    const cards = document.querySelectorAll(`.card`);
    if (cards[i]) cards[i].classList.toggle("hidden", !match);
    if (!groups[d.g]) groups[d.g] = false;
    if (match) groups[d.g] = true;
  });
  document.querySelectorAll(".group-label, .cards").forEach(el => {
    if (el.dataset.group) el.style.display = groups[el.dataset.group] === false ? "none" : "";
  });
}

// ── 실제 실행 가능한 API 맵 ─────────────────────────────────────────────
const ACTION_APIS = {
  gmail_open:             { method:"GET",  path:"/api/v1/google/tools/gmail/inbox",           render: renderList("items","from_preview","subject_preview") },
  calendar_open:          { method:"GET",  path:"/api/v1/google/tools/calendar/today",         render: renderList("events","title","aria") },
  drive_open:             { method:"GET",  path:"/api/v1/google/tools/drive/recent",            render: renderList("files","name","") },
  docs_open:              { method:"GET",  path:"/api/v1/google/tools/docs/recent",             render: renderList("docs","name","url") },
  sheets_open:            { method:"GET",  path:"/api/v1/google/tools/sheets/recent",           render: renderList("sheets","name","url") },
  youtube_open:           { method:"GET",  path:"/api/v1/google/tools/youtube/search?query=",  render: renderList("results","title","channel") },
  youtube_studio_open:    { method:"GET",  path:"/api/v1/google/tools/youtube/studio/status",  render: renderChannel },
  cloud_console_open:     { method:"GET",  path:"/api/v1/google/tools/gcp/status",             render: renderGcp },
};

function renderList(listKey, col1, col2) {
  return (d, name) => {
    const items = d[listKey] || [];
    if (!items.length) return `<span class="domain-tag">${name}</span> 결과 없음`;
    const rows = items.slice(0,5).map(i =>
      `<div style="font-size:11px;padding:2px 0;border-bottom:1px solid #334155">
        <span style="color:#E2E8F0">${(i[col1]||'').substring(0,50)}</span>
        ${col2 && i[col2] ? `<span style="color:#64748B;margin-left:6px">${(i[col2]||'').substring(0,40)}</span>` : ''}
      </div>`
    ).join('');
    return `<span class="domain-tag">${name}</span> ${items.length}건<br>${rows}`;
  };
}

function renderChannel(d, name) {
  const ch = d.channel || {};
  if (!ch.title) return `<span class="domain-tag">${name}</span> 채널 정보 없음`;
  return `<span class="domain-tag">YouTube Studio</span> <b>${ch.title}</b><br>
    <small style="color:#94A3B8">구독자 ${ch.subscriber_count || '?'} · 동영상 ${ch.video_count || '?'} · 조회수 ${ch.view_count || '?'}</small>`;
}

function renderGcp(d, name) {
  return `<span class="domain-tag">GCP</span> ${d.project || ''}<br>
    <small style="color:#94A3B8">${d.url || ''}</small>`;
}

// ── 도메인 열기 + 실제 데이터 가져오기 ──────────────────────────────────
async function openDomain(url, name, actionKey) {
  addMsg("user", `${name} 확인`);
  const api = actionKey && ACTION_APIS[actionKey];
  if (api && SERVER) {
    const btn = event?.target;
    if (btn) { btn.disabled = true; btn.textContent = "로딩중..."; }
    try {
      const fullUrl = SERVER + api.path;
      const res = await fetch(fullUrl, { headers: { "x-license-key": LICENSE } });
      const d = await res.json();
      if (d.ok !== false) {
        addMsg("ai", api.render(d, name));
      } else {
        addMsg("ai", `<span class="domain-tag">${name}</span> <span class="err">${d.error || "오류"}</span> — <a href="#" onclick="navigateOut('${url}')">사이트 열기</a>`);
      }
    } catch {
      navigateOut(url);
      addMsg("ai", `<span class="domain-tag">${name}</span> 사이트를 열었습니다.`);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "🔗 열기"; }
    }
  } else {
    navigateOut(url);
    addMsg("ai", `<span class="domain-tag">${name}</span> 사이트를 열었습니다.`);
  }
}

function navigateOut(url) {
  window.parent.postMessage({ type: "navigate-external", url }, "*");
}

// ── 상태 변경 액션 요청 ──────────────────────────────────────────────────
async function requestAction(host, actionKey, label, domainName) {
  addMsg("user", `${domainName} → ${label}`);
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = "처리중..."; }
  try {
    const res = await fetch(`${SERVER}/api/v1/google/action`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-license-key": LICENSE },
      body: JSON.stringify({ host, action_key: actionKey })
    });
    const d = await res.json();
    if (d.ok) {
      addMsg("ai", `<span class="action-tag">✅ ${label}</span> ${d.message || "완료"}`);
    } else {
      addMsg("ai", `<span class="action-tag">🔒 ${label}</span> <span class="err">${d.reason || d.detail || "승인 필요"}</span>`);
    }
  } catch {
    addMsg("ai", `<span class="domain-tag">${domainName}</span> <span class="err">서버 미연결 — 사이트를 직접 여세요.</span>`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

// ── 채팅 처리 ────────────────────────────────────────────────────────────
async function sendChat() {
  const input = document.getElementById("chat-input");
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  document.getElementById("chat-send").disabled = true;

  addMsg("user", msg);

  // 1. 키워드 매핑
  const lm = msg.toLowerCase();
  const matched = CMD_MAP.find(c => c.words.some(w => lm.includes(w)));

  if (matched) {
    highlightCard(matched.host);
    const api = ACTION_APIS[matched.action];
    if (api && SERVER) {
      addMsg("ai", `<span class="domain-tag">${matched.domain}</span> 데이터를 가져옵니다...`);
      try {
        const res = await fetch(SERVER + api.path, { headers: { "x-license-key": LICENSE } });
        const d = await res.json();
        if (d.ok !== false) {
          const dom = CATALOG.find(c => c.host === matched.host);
          addMsg("ai", api.render(d, matched.domain));
        } else {
          addMsg("ai", `<span class="domain-tag">${matched.domain}</span> <span class="err">${d.error||"오류"}</span>`);
        }
      } catch {
        addMsg("ai", `<span class="domain-tag">${matched.domain}</span> <span class="err">서버 연결 필요</span>`);
      }
    } else {
      // 채팅 API 위임
      try {
        const res = await fetch(`${SERVER}/api/v1/google/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-license-key": LICENSE },
          body: JSON.stringify({ message: msg, domain: matched.domain, action_key: matched.action, host: matched.host })
        });
        const d = await res.json();
        addMsg("ai", d.reply || `<span class="domain-tag">${matched.domain}</span> 처리됨`);
      } catch {
        const dom = CATALOG.find(c => c.host === matched.host);
        if (dom) { navigateOut(dom.url); addMsg("ai", `<span class="domain-tag">${matched.domain}</span> 사이트를 열었습니다.`); }
      }
    }
  } else {
    // 서버에 전체 위임
    try {
      const res = await fetch(`${SERVER}/api/v1/google/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-license-key": LICENSE },
        body: JSON.stringify({ message: msg })
      });
      const d = await res.json();
      addMsg("ai", d.reply || "명령을 처리했습니다.");
    } catch {
      addMsg("ai", `<span class="err">어떤 구글 서비스를 원하시나요?</span> 예) "Gmail 열어줘", "드라이브 파일 보여줘", "캘린더 일정 추가해줘"`);
    }
  }

  document.getElementById("chat-send").disabled = false;
  input.focus();
}

function addMsg(role, html) {
  const box = document.getElementById("chat-messages");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = html;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ── shell.html iframe 메시지 처리 ────────────────────────────────────────
window.addEventListener("message", e => {
  if (e.data?.type === "hub-navigate") {
    const dom = CATALOG.find(c => c.host === e.data.host);
    if (dom) openDomain(dom.url, dom.name);
  }
});

buildCards();
</script>
