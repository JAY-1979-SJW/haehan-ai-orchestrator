# audit-kit(프로그램 건강도 검사) 설정 전용. 이 저장소의 패키지 설치/빌드 설정이 아니다 —
# 의존성은 requirements.txt, ruff 는 configs/ruff.toml 을 그대로 쓴다(이 파일에는 ruff 설정을 넣지 않는다).
[tool.audit-kit]
# 전체 pytest 는 tests/test_local_agent_installer_package.py 에서 멈추는 기존 결함이 있어(CLAUDE.md gotcha)
# audit-kit 안에서 돌리지 않는다. 테스트는 CI 의 verify(영향 테스트)가 맡는다.
run_tests = false

# 편집 후 hook(audit_kit_gate.py --post-edit/--stop): ruff·mypy 는 scripts/ops/post_edit_fast_gate.py 가 이미 (신규 오류만)
# 보므로 끄고, audit-kit 고유의 개발 기준서 파일 단위 검사(조항 ID, 신규/기존 구분)와 순환 import 검사만 건다.
# 문제가 있으면 exit 2 로 막는다(block) — 코드를 쓸 때·세션 종료 때 필수.
hook_tools = "design"
hook_mode = "block"

# 기본값은 B105/B106/B107(하드코딩 비밀번호 의심)을 '개선'으로 올린다. 2026-09-30 이 앱 414건을
# 전수 확인한 결과 전부 테스트 더미 값('pw-owner', 'redacted' 등)·불리언/None 상수·공개 URL 이라
# 실제 비밀값이 아니었다. 실제 비밀값 검사는 CI gitleaks 와 audit-kit std 의 SEC 규칙이 맡는다.
bandit_promote = []

# B008(함수 기본값 안의 함수 호출)은 FastAPI 의존성 주입 표준 패턴(Depends/require_role/File/Body)이라
# 2026-09-30 이 앱 468건 전수 확인 결과 전부 오탐. 프로젝트 ruff 설정(configs/ruff.toml)도 같은 이유로 제외 중.
# 아래 목록은 audit-kit 기본값(E1,E2,E3,E5,W,I,N,D,Q,COM)에 B008 만 더한 것 — 기본값을 덮어쓰므로 유지할 것.
ruff_ignore = ["E1", "E2", "E3", "E5", "W", "I", "N", "D", "Q", "COM", "B008"]
