name: CI

# 2026-09-29 결정: docs/specs/2026-09-24_self_hosted_ci_jenkins.md 는 "GitHub Actions는
# 쓰지 않는다"는 기존 결정을 담고 있었으나, 자체 Jenkins CI는 설계만 있고 구현되지 않았음
# (docs/defect_index.json #4). 사용자 승인으로 GitHub Actions를 먼저 도입한다.
#
# 핵심 검증은 이 저장소가 이미 갖고 있는 "로컬 CI" 도구를 그대로 재사용한다
# (tools/verify_change.py — base/head를 같은 방식으로 재서 "기준 대비 새로 생긴
# 문제"만 FAIL로 잡는다. 신선한 CI 환경에서 흔한 플레이키/외부서비스 실패를 base·head
# 양쪽에서 동일하게 겪으므로 상쇄된다). win32com·uiautomation 등 Windows 전용 의존성 때문에
# Windows 러너를 쓴다(Linux 러너에서는 import 단계부터 실패).
#
# 2026-09-30: 저장소가 PUBLIC 으로 바뀌어 GitHub 호스팅 러너(windows-latest)가 무료 무제한이라
# 2026-09-29 의 자체 호스팅 러너 전환(결제 차단 대응, 0dcab481)을 되돌렸다. 공개 저장소에서
# self-hosted 러너를 쓰면 외부 PR 코드가 이 PC에서 실행될 수 있는 보안 위험도 있다.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # labeled·unlabeled: 지휘창이 folder-approved 라벨을 붙이면(폴더 승인 게이트 G16) CI 가 다시 돌아 통과하게 한다
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      base:
        description: '비교 기준 ref 또는 sha (비우면 직전 커밋 HEAD^ 기준). 작업 브랜치 전체를 검증하려면 예: master'
        required: false
        type: string

# 공개 저장소 기본값: 토큰 권한 최소화 + 같은 브랜치의 이전 실행은 새 푸시가 오면 취소
permissions:
  contents: read

# 모든 python 단계 공통 UTF-8 — Windows 러너의 기본 인코딩(cp1252)에서는 한국어 print/open 이 UnicodeEncodeError 로 죽는다
# (2026-10-07 desktop-release 와 같은 원인 예방). 개별 파일을 고치지 않고 실행 환경에서 한 번에 해결한다.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 비밀값(API 키·토큰) 커밋 검사 — 저장소가 공개이고 과거 키 유출 이력(2026-09-29)이 있음.
  # 이번 푸시/PR 의 커밋 범위만 검사한다(과거 기록의 이미 노출된 키로 영구 실패하지 않도록).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # push/PR 은 액션이 커밋 범위만 검사한다. workflow_dispatch 는 범위가 없어 전체 이력을 훑으므로 아래 단계로 대신한다.
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 수동 실행(workflow_dispatch): base..HEAD 범위만 검사 — push/PR 과 같은 범위 방식. base 입력이 없으면 직전 커밋(HEAD^) 기준.
      # 옛 이력의 검출은 이 범위 밖이라 영구 실패하지 않는다(옛 검출을 '비밀 아님'으로 판정하는 일은 별도 확인 사항).
      # gitleaks 바이너리는 공식 릴리스(v8.24.3)를 내려받아 SHA256 으로 고정 확인한다(액션이 쓰는 것과 같은 버전).
      - name: gitleaks (수동 실행 — base..HEAD 범위)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_BASE}" ]; then
            base=$(bash scripts/ci/resolve_ci_base.sh)
          else
            base=$(git rev-parse --verify --quiet "HEAD^" || git rev-parse --verify "HEAD")
          fi
          ver=8.24.3
          sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "gitleaks 범위: ${base}..HEAD"
          "$RUNNER_TEMP/gitleaks" detect --redact -v --exit-code=2 --log-opts="--no-merges ${base}..HEAD"

  # admin-web 변경 여부 판정 — frontend job을 admin-web/** 가 바뀐 push/PR에서만 돌린다
  # (2026-10-07 R4: 화면 코드 검증 공백 메우기. push 이벤트는 매번 전체 돌아도 무방할
  # 만큼 드물지만(master 직푸시), PR은 수가 많아 무관한 변경에서도 매번 npm ci를
  # 치르면 낭비 — dorny/paths-filter 는 프로젝트 의존성을 새로 들이지 않는 GH Action).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admin_web: ${{ steps.filter.outputs.admin_web }}
    steps:
      - uses: actions/checkout@v7
      # 공개 저장소 + 공급망 보안 — 제3자 액션은 태그가 아니라 전체 SHA로 고정
      # (태그는 재지정 가능). git ls-remote 로 v3(=v3.0.4) 해석한 SHA.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            admin_web:
              - 'admin-web/**'

  # 프런트(admin-web) 타입체크 — 화면 코드가 CI 에서 검증되지 않던 공백을 메운다.
  frontend:
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # base/head 계산 — 아래 job 들이 같이 쓴다
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine base/head refs
        id: refs
        shell: bash
        # 수동 실행 입력(inputs.base)은 스크립트 주입을 막으려고 run 안에 직접 쓰지 않고 env 로만 넘긴다.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_BASE" ]; then
              # 수동 실행에서 base 를 준 경우: 브랜치 전체를 그 기준과 비교(checkout fetch-depth: 0 이라 origin/* ref 사용 가능)
              # scripts/ci/resolve_ci_base.sh — 짧은 해시·긴 해시·브랜치 이름을 한 줄 해시로 풀고, 못 풀면 명확한 오류로 종료한다
              # (옛 방식 `git rev-parse origin/X || git rev-parse X` 는 없는 ref 의 이름을 stdout 에 찍어 base 가 두 줄이 됐다)
              base=$(bash scripts/ci/resolve_ci_base.sh)
            fi
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  # verify 는 job 3종으로 나눠 병렬로 돈다(2026-10-08, 영향 시험 20여 분이 전체를 지배해 35분 걸리던 것을 단축):
  #   refs         base/head 계산(한 번)
  #   verify-static  게이트·코드맵·audit-kit·mypy·ruff (시험 제외)
  #   verify-tests   영향 시험 묶음 3개(matrix) — base·head 에서 돌려 실패 목록만 남긴다
  #   verify         위 결과를 합쳐 판정(필수 검사 이름은 그대로 verify). 검사를 약하게 하는 변경이 아니다 — 같은 판정, 나눠서 돌릴 뿐.
  verify-static:
    needs: refs
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # constraints.txt = 검증된 환경(Windows, Python 3.14)의 버전 집합 — 설치 시점마다 버전이 달라지지 않게 고정한다
          # (tools/devflow/make_constraints.py 로 재생성, docs/specs/2026-10-04_portability_standard.md)
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Install dev tools (ruff · pytest-timeout)
        # 런타임 requirements 에는 없는 검증 도구. 없으면 shim 계약 시험(ruff)·run_impacted_tests(--timeout)가 CI 에서만 실패하고,
        # verify_change 의 '바뀐 파일 ruff' 가 조용히 건너뛰어진다(requirements-dev.txt 머리말 참고).
        run: python -m pip install -r requirements-dev.txt

      - name: Install audit-kit + mypy (개발 기준서·타입 신규 오류 검사용 별도 가상환경)
        # verify_change.py 가 AUDIT_KIT_BIN 의 audit-kit 로 기준서 검사를, 같은 가상환경의 mypy 로 "기준 대비 신규 타입 오류"만
        # 검사한다(공개 저장소라 토큰 불필요). 프로젝트 의존성과 섞이지 않게, 그리고 저장소 스캔(layer audit 등)에
        # 잡히지 않게 작업 폴더 밖(RUNNER_TEMP)의 별도 가상환경에 설치한다.
        # 설치 실패 시 이 스텝이 FAIL 하므로 검사가 조용히 생략되는 일은 없다.
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/akvenv"
          "$RUNNER_TEMP/akvenv/Scripts/python.exe" -m pip install --upgrade pip
          "$RUNNER_TEMP/akvenv/Scripts/python.exe" -m pip install mypy "git+https://github.com/JAY-1979-SJW/audit-kit"
          test -f "$RUNNER_TEMP/akvenv/Scripts/audit-kit.exe"
          echo "AUDIT_KIT_BIN=$RUNNER_TEMP/akvenv/Scripts/audit-kit.exe" >> "$GITHUB_ENV"
          echo "AUDIT_KIT_REQUIRED=1" >> "$GITHUB_ENV"

      - name: R1 API 계약 게이트 (admin-web↔FastAPI 신규 끊긴 호출 차단)
        # 영향 테스트 선택만으로는 admin-web 단독 변경 커밋에서 안 돌 수 있어(2026-10-07
        # 지휘창 지적) CI에 직접 연결. 기존 끊긴 호출(configs/r1_api_contract_baseline.json
        # 허용목록)은 통과, 새로 끊기는 호출만 FAIL.
        # continue-on-error+id: 이 단계가 죽어도 뒤 게이트들이 마저 돌아 한 번에 전부 보이게
        # 한다("추가 5", 2026-10-09) — 완화 아님, 맨 끝 "verify-static 게이트 결과 집계" 단계가
        # 하나라도 실패하면 작업 전체를 FAIL 로 되돌린다.
        id: gate_r1
        continue-on-error: true
        run: python tools/repo_gates/audit_r1_api_contract_gate.py

      - name: 도구 집 게이트 (도구 키워드 파일이 집 밖에 새로 생기면 차단)
        # 도구 파일은 구현 scripts/<도구>/·API connectors/<도구>/·화면 app/<도구>/ 집 안에 둔다
        # (docs/architecture/TOOL_HOME_MAP.md). 기존 집 밖 파일은 configs/tool_home_baseline.json 으로
        # 고정, 기준선에 없는 새 이탈만 FAIL. 규칙·예외 사유: configs/tool_home.json.
        id: gate_tool_home
        continue-on-error: true
        run: python tools/repo_gates/tool_home_gate.py --check-all
      - name: 최상위 평면 금지 게이트 (scripts·ai_orchestrator·루트 평면에 새 .py 가 생기면 차단)
        # 새 코드는 알맞은 하위 폴더에 둔다(docs/architecture/FOLDER_STRUCTURE.md). 기존 평면 파일은
        # configs/flat_root_baseline.json 으로 고정(줄이기만), 기준선에 없는 새 평면 파일만 FAIL.
        # 규칙·허용 진입점: configs/flat_root_gate.json.
        id: gate_flat_root
        continue-on-error: true
        run: python tools/repo_gates/flat_root_gate.py --check-all
      - name: 번들 경로 일관성 게이트 (spec·electron-builder·electron js·릴리스 워크플로의 깨진 경로/모듈 차단 — G17)
        # PyInstaller spec 진입 파일·우리 모듈 hiddenimports·datas, admin-web/electron/package.json extraResources,
        # lib/*.js 의 process.resourcesPath 경로, desktop-release.yml 경로가 실제(git 추적) 파일과 맞는지 본다.
        # 폴더 이동 뒤 이 참조들이 그대로 남아 데스크톱 앱이 반복해 깨졌다(2026-10-08). 규칙: tools/repo_gates/bundle_path_gate.py 머리말.
        id: gate_bundle_path
        continue-on-error: true
        run: python tools/repo_gates/bundle_path_gate.py --check-all
      - name: 폴더 승인 게이트 (승인 목록에 없는 폴더에 코드 파일이 있으면 차단 — G16)
        # 코드(.py·.ts·.tsx·.js)가 든 모든 폴더는 configs/folder_registry.json 에 승인돼 있어야 한다. 새 폴더는 대표님 승인 후 목록에 추가.
        # 규칙·절차: tools/repo_gates/folder_gate.py 머리말, docs/architecture/FOLDER_STRUCTURE.md.
        id: gate_folder
        continue-on-error: true
        run: python tools/repo_gates/folder_gate.py --check-all
      - name: Codebase layer audit (구조/보안/순환 게이트)
        # codebase_layer_audit.py 자체 종료코드는 CLAUDE.md가 실제 차단 조건으로 명시한
        # forbidden_imports/security_patterns/circular_imports 외에 "unknown layer 파일 수"
        # 같은 별도 threshold까지 포함해, 이 저장소에 이미 있던 무관한 문제로도 실패한다
        # (2026-09-29 실측: threshold.unknown_layers 만 FAIL, 나머지 14개 일관성 검사는 PASS).
        # ci_layer_gate_check.py 가 CLAUDE.md "게이트 실행 의무"에 명시된 3개 지표만 판정한다.
        # shell: bash 만 쓰면 이 self-hosted 러너 PATH에서 WSL 스텁(C:\Windows\System32\
        # bash.exe)이 Git Bash보다 먼저 잡혀 임시 스크립트의 Windows 경로를 못 읽고
        # "No such file or directory"로 실패한다(2026-09-29 실측) — 위 "Git Bash를 PATH
        # 우선순위로" 스텝이 GITHUB_PATH 로 이미 고쳐뒀으므로 여긴 기본 shell: bash 사용.
        shell: bash
        run: |
          python tools/repo_gates/codebase_layer_audit.py || true
          python tools/repo_gates/ci_layer_gate_check.py

      - name: Layer audit self-test
        run: python -m pytest tests/test_codebase_layer_audit.py -q

      - name: 폴더 승인 증거 (목록에 폴더가 추가되면 PR 라벨 folder-approved 필요 — G16)
        # 라벨 이름은 사용자 입력이라 run 안에 직접 쓰지 않고 env(FOLDER_GATE_LABELS)로만 넘긴다. 이벤트 종류는 Actions 가 GITHUB_EVENT_NAME 으로 준다.
        # pull_request: 추가가 있으면 라벨 필요 · workflow_dispatch: 추가가 있으면 FAIL · push: 병합 전 PR 에서 확인했으므로 경고만.
        env:
          FOLDER_GATE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python tools/repo_gates/folder_gate.py --check-approval --base ${{ needs.refs.outputs.base }} --head ${{ needs.refs.outputs.head }}

      - name: G12 중복 게이트 (신규 구조동일 중복 함수 차단)
        # dup_gate.py check — PR의 base..head 사이에 바뀐(추가/수정) .py 파일만 대상.
        # 기존 중복은 configs/dup_baseline.json 기준선으로 고정(새로 생긴 것만 FAIL).
        id: gate_g12_diff
        continue-on-error: true
        shell: bash
        run: |
          # verify job 의 refs 단계가 계산한 base(PR base · push before · 수동 실행 base 입력)를 그대로 쓴다
          base="${{ needs.refs.outputs.base }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACM "$base" HEAD -- '*.py')
          if [ "${#changed[@]}" -gt 0 ]; then
            changed_file="$RUNNER_TEMP/g12_changed_py.txt"
            printf '%s\n' "${changed[@]}" > "$changed_file"
            python tools/repo_gates/dup_gate.py check --files-from "$changed_file"
          else
            echo "변경된 .py 없음 — G12 건너뜀"
          fi
      - name: G12 중복 전체 비교 (기준선에 없는 새 중복 묶음이 저장소에 하나라도 있으면 FAIL)
        # 위 단계는 PR 이 바꾼 파일만 본다 — 두 파일이 모두 이번에 안 바뀌었거나 한쪽만 바뀐 새 중복은 놓친다(2026-10-07 기준선 감사에서
        # 기준선에 없는 중복 2묶음이 실제로 샜다). 저장소 전체 묶음을 기준선과 비교한다.
        id: gate_g12_all
        continue-on-error: true
        run: python tools/repo_gates/dup_gate.py check --all
      - name: 루트 직접 계산 차단 게이트 (새 줄만 — Path(__file__).parents[N] 등)
        # 저장소 루트를 파일마다 따로 계산하는 새 줄을 차단한다(기존 줄은 통과). 정본: ai_orchestrator.paths.repo_root /
        # scripts.common.app_paths.repo_root. 예외·사유: configs/root_calc_gate.json.
        id: gate_root_calc
        continue-on-error: true
        run: python tools/repo_gates/root_calc_gate.py --check-diff ${{ needs.refs.outputs.base }} ${{ needs.refs.outputs.head }}

      - name: Verify change — static (코드맵·층·순환·audit-kit·mypy·ruff; 시험은 verify-tests 가 돌린다)
        run: >
          python tools/verify_change.py --phase static
          --base ${{ needs.refs.outputs.base }}
          --head ${{ needs.refs.outputs.head }}
          --json verify_static.json

      - name: Upload static result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-static
          path: verify_static.json
          if-no-files-found: ignore

      - name: verify-static 게이트 결과 집계 (continue-on-error 로 미뤄둔 실패를 한 번에 보여주고 FAIL)
        # 위 게이트들(R1·도구 집·평면·번들·폴더 승인·G12 2개·루트 계산)은 continue-on-error 로
        # 서로를 가리지 않게 했다 — 여기서 실패한 단계 이름을 모아 한 번에 출력하고, 하나라도
        # 있으면 이 작업을 FAIL 로 되돌린다("추가 5", 2026-10-09). 판정 완화가 아니다: 최종 결과는
        # 여전히 FAIL, 달라지는 건 "한 번에 전부 보여준다"는 점뿐.
        if: always()
        shell: bash
        run: |
          declare -A names=(
            [gate_r1]="R1 API 계약 게이트"
            [gate_tool_home]="도구 집 게이트"
            [gate_flat_root]="최상위 평면 금지 게이트"
            [gate_bundle_path]="번들 경로 일관성 게이트"
            [gate_folder]="폴더 승인 게이트"
            [gate_g12_diff]="G12 중복 게이트"
            [gate_g12_all]="G12 중복 전체 비교"
            [gate_root_calc]="루트 직접 계산 차단 게이트"
          )
          outcomes=(
            "gate_r1:${{ steps.gate_r1.outcome }}"
            "gate_tool_home:${{ steps.gate_tool_home.outcome }}"
            "gate_flat_root:${{ steps.gate_flat_root.outcome }}"
            "gate_bundle_path:${{ steps.gate_bundle_path.outcome }}"
            "gate_folder:${{ steps.gate_folder.outcome }}"
            "gate_g12_diff:${{ steps.gate_g12_diff.outcome }}"
            "gate_g12_all:${{ steps.gate_g12_all.outcome }}"
            "gate_root_calc:${{ steps.gate_root_calc.outcome }}"
          )
          failed=()
          for entry in "${outcomes[@]}"; do
            id="${entry%%:*}"; outcome="${entry#*:}"
            if [ "$outcome" = "failure" ]; then
              failed+=("${names[$id]}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "[verify-static] continue-on-error 로 미룬 게이트 중 실패 ${#failed[@]}건:"
            for n in "${failed[@]}"; do echo "  - $n"; done
            exit 1
          fi
          echo "[verify-static] 게이트 결과 집계 — 전부 PASS"

  verify-tests:
    needs: refs
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CI 러너는 매번 새로 clone 해서 core.hooksPath 가 비어 있다 — module_quality_gate 의
      # test_required_local_gate_wiring_passes_current_sources 가 `git config --get
      # core.hooksPath` 를 직접 읽고 .githooks 를 기대하므로, 로컬 개발 환경과 똑같이 맞춰준다
      # (2026-10-10, PR165 verify FAIL 조사 중 발견).
      - name: Set core.hooksPath
        run: git config core.hooksPath .githooks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt

      # requirements.txt 에 playwright 패키지는 있지만 실제 브라우저 실행파일 다운로드 단계가
      # 없어 tests/browser/* 의 real-browser smoke 시험이 매번 "Executable doesn't exist" 로
      # 깨졌다(2026-10-10, PR165 verify FAIL 조사 중 발견 — 이 시험들은 PR 기간에 새로 추가돼
      # new-only 제외 대상이 아니라 CI 환경 자체를 고쳐야 한다).
      - name: Install Playwright browser (chromium)
        run: python -m playwright install chromium

      - name: Verify change — tests ${{ matrix.shard }}/3
        run: >
          python tools/verify_change.py --phase tests --shard ${{ matrix.shard }}/3
          --base ${{ needs.refs.outputs.base }}
          --head ${{ needs.refs.outputs.head }}
          --json verify_tests_${{ matrix.shard }}.json

      - name: Upload tests result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-tests-${{ matrix.shard }}
          path: |
            verify_tests_${{ matrix.shard }}.json
            verify_raw_dumps/
          if-no-files-found: ignore

  # 최종 판정 — 필수 검사 이름 'verify' 를 유지한다. static 과 시험 묶음 3개가 모두 성공해야 하고, 묶음 결과가 하나라도 빠지면 FAIL.
  verify:
    needs: [refs, verify-static, verify-tests]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 앞선 job 결과 확인
        shell: bash
        env:
          RESULTS: ${{ needs.verify-static.result }} ${{ needs.verify-tests.result }}
        run: |
          echo "static/tests: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "앞선 job 이 success 가 아니다: $RESULTS"; exit 1; fi
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download results
        uses: actions/download-artifact@v7
        with:
          path: verify_parts

      - name: Verify change — report (static + 시험 묶음 합쳐 판정)
        shell: bash
        run: >
          python tools/verify_change.py --phase report
          --base ${{ needs.refs.outputs.base }}
          --head ${{ needs.refs.outputs.head }}
          --static-json verify_parts/verify-static/verify_static.json
          --test-json verify_parts/verify-tests-1/verify_tests_1.json verify_parts/verify-tests-2/verify_tests_2.json verify_parts/verify-tests-3/verify_tests_3.json
          --json verify_change_result.json

      - name: Upload verify_change report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-change-report
          path: verify_change_result.json
          if-no-files-found: ignore
