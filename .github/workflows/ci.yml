name: CI

# 2026-09-29 결정: docs/specs/2026-09-24_self_hosted_ci_jenkins.md 는 "GitHub Actions는
# 쓰지 않는다"는 기존 결정을 담고 있었으나, 자체 Jenkins CI는 설계만 있고 구현되지 않았음
# (docs/defect_index.json #4). 사용자 승인으로 GitHub Actions를 먼저 도입한다.
#
# 핵심 검증은 이 저장소가 이미 갖고 있는 "로컬 CI" 도구를 그대로 재사용한다
# (scripts/ops/verify_change.py — base/head를 같은 방식으로 재서 "기준 대비 새로 생긴
# 문제"만 FAIL로 잡는다. 신선한 CI 환경에서 흔한 플레이키/외부서비스 실패를 base·head
# 양쪽에서 동일하게 겪으므로 상쇄된다). win32com·uiautomation 등 Windows 전용 의존성 때문에
# Windows 러너를 쓴다(Linux 러너에서는 import 단계부터 실패).
#
# 2026-09-30: 저장소가 PUBLIC 으로 바뀌어 GitHub 호스팅 러너(windows-latest)가 무료 무제한이라
# 2026-09-29 의 자체 호스팅 러너 전환(결제 차단 대응, 0dcab481)을 되돌렸다. 공개 저장소에서
# self-hosted 러너를 쓰면 외부 PR 코드가 이 PC에서 실행될 수 있는 보안 위험도 있다.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# 공개 저장소 기본값: 토큰 권한 최소화 + 같은 브랜치의 이전 실행은 새 푸시가 오면 취소
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 비밀값(API 키·토큰) 커밋 검사 — 저장소가 공개이고 과거 키 유출 이력(2026-09-29)이 있음.
  # 이번 푸시/PR 의 커밋 범위만 검사한다(과거 기록의 이미 노출된 키로 영구 실패하지 않도록).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # admin-web 변경 여부 판정 — frontend job을 admin-web/** 가 바뀐 push/PR에서만 돌린다
  # (2026-10-07 R4: 화면 코드 검증 공백 메우기. push 이벤트는 매번 전체 돌아도 무방할
  # 만큼 드물지만(master 직푸시), PR은 수가 많아 무관한 변경에서도 매번 npm ci를
  # 치르면 낭비 — dorny/paths-filter 는 프로젝트 의존성을 새로 들이지 않는 GH Action).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admin_web: ${{ steps.filter.outputs.admin_web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin_web:
              - 'admin-web/**'

  # 프런트(admin-web) 타입체크 — 화면 코드가 CI 에서 검증되지 않던 공백을 메운다.
  frontend:
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # constraints.txt = 검증된 환경(Windows, Python 3.14)의 버전 집합 — 설치 시점마다 버전이 달라지지 않게 고정한다
          # (scripts/ops/make_constraints.py 로 재생성, docs/specs/2026-10-04_portability_standard.md)
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Install audit-kit + mypy (개발 기준서·타입 신규 오류 검사용 별도 가상환경)
        # verify_change.py 가 AUDIT_KIT_BIN 의 audit-kit 로 기준서 검사를, 같은 가상환경의 mypy 로 "기준 대비 신규 타입 오류"만
        # 검사한다(공개 저장소라 토큰 불필요). 프로젝트 의존성과 섞이지 않게, 그리고 저장소 스캔(layer audit 등)에
        # 잡히지 않게 작업 폴더 밖(RUNNER_TEMP)의 별도 가상환경에 설치한다.
        # 설치 실패 시 이 스텝이 FAIL 하므로 검사가 조용히 생략되는 일은 없다.
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/akvenv"
          "$RUNNER_TEMP/akvenv/Scripts/python.exe" -m pip install --upgrade pip
          "$RUNNER_TEMP/akvenv/Scripts/python.exe" -m pip install mypy "git+https://github.com/JAY-1979-SJW/audit-kit"
          test -f "$RUNNER_TEMP/akvenv/Scripts/audit-kit.exe"
          echo "AUDIT_KIT_BIN=$RUNNER_TEMP/akvenv/Scripts/audit-kit.exe" >> "$GITHUB_ENV"
          echo "AUDIT_KIT_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Codebase layer audit (구조/보안/순환 게이트)
        # codebase_layer_audit.py 자체 종료코드는 CLAUDE.md가 실제 차단 조건으로 명시한
        # forbidden_imports/security_patterns/circular_imports 외에 "unknown layer 파일 수"
        # 같은 별도 threshold까지 포함해, 이 저장소에 이미 있던 무관한 문제로도 실패한다
        # (2026-09-29 실측: threshold.unknown_layers 만 FAIL, 나머지 14개 일관성 검사는 PASS).
        # ci_layer_gate_check.py 가 CLAUDE.md "게이트 실행 의무"에 명시된 3개 지표만 판정한다.
        # shell: bash 만 쓰면 이 self-hosted 러너 PATH에서 WSL 스텁(C:\Windows\System32\
        # bash.exe)이 Git Bash보다 먼저 잡혀 임시 스크립트의 Windows 경로를 못 읽고
        # "No such file or directory"로 실패한다(2026-09-29 실측) — 위 "Git Bash를 PATH
        # 우선순위로" 스텝이 GITHUB_PATH 로 이미 고쳐뒀으므로 여긴 기본 shell: bash 사용.
        shell: bash
        run: |
          python scripts/ops/codebase_layer_audit.py || true
          python scripts/ops/ci_layer_gate_check.py

      - name: Layer audit self-test
        run: python -m pytest tests/test_codebase_layer_audit.py -q

      - name: Determine base/head refs
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify change (ruff + 영향 테스트 + 라우트/구조 대조, 기준 대비 새 문제만 FAIL)
        run: >
          python scripts/ops/verify_change.py
          --base ${{ steps.refs.outputs.base }}
          --head ${{ steps.refs.outputs.head }}
          --json verify_change_result.json

      - name: Upload verify_change report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-change-report
          path: verify_change_result.json
          if-no-files-found: ignore
