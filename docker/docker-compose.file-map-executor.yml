# Compose fragment for file-map-executor service
# Use with: docker compose -f docker-compose.yml -f docker/docker-compose.file-map-executor.yml

version: "3.9"

services:
  file-map-executor:
    build:
      context: ..
      dockerfile: docker/file-map-executor.Dockerfile
    image: haehan-ai-orchestrator-file-map-executor:local
    container_name: haehan-ai-orchestrator-file-map-executor
    working_dir: /app

    # Internal port only (no host mapping)
    expose:
      - "8510"

    volumes:
      # Optional: Mount logs for debugging
      # - ./logs/file-map-executor:/app/logs

    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8510"
      EXECUTOR_MODE: "service"

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Register with same networks as admin-web for internal communication
    networks:
      - default
      - app_web

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8510/health', timeout=3)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  # Reference existing networks (created by main docker-compose.yml)
  app_web:
    external: true
    name: app_web
